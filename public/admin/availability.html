<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ניהול חלונות זום — scale-up.finance</title>
  <style>
    :root { --green:#1B3A28; --green2:#28402E; --sage:#5A9A72; --mute:#62806A; --bg:#F4F6F4; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: 'Heebo', Arial, sans-serif; background:var(--bg); color:var(--green); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { color: var(--mute); font-size: 14px; margin-bottom: 24px; }
    .card { background:#fff; border:1px solid #e3eae4; border-radius:16px; padding:20px; margin-bottom:16px; }
    label { display:block; font-size:13px; font-weight:600; color:var(--mute); margin-bottom:6px; }
    input { width:100%; padding:11px 12px; border:1px solid #cdd8cf; border-radius:10px; font-size:15px; font-family:inherit; }
    button { font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-weight:700; }
    .btn { background:var(--sage); color:#fff; padding:11px 18px; font-size:15px; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .btn-ghost { background:transparent; color:var(--mute); padding:6px 10px; font-size:13px; border:1px solid #cdd8cf; }
    .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    .row > div { flex:1; min-width:130px; }
    .slot { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid #e3eae4; border-radius:10px; margin-bottom:8px; }
    .slot small { color:var(--mute); }
    .del { background:#fbeaea; color:#a33; padding:6px 12px; font-size:13px; }
    .msg { font-size:14px; padding:10px 12px; border-radius:10px; margin-top:12px; }
    .msg.ok { background:#eaf3ec; color:#1B3A28; }
    .msg.err { background:#fbeaea; color:#a33; }
    .empty { color:var(--mute); font-size:14px; text-align:center; padding:16px 0; }
    .day-head { font-size:13px; font-weight:700; color:var(--sage); margin:14px 0 6px; }
    .save-bar { position:sticky; bottom:0; background:var(--bg); padding-top:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ניהול חלונות זום</h1>
    <p class="sub">היומן סגור כברירת מחדל. כאן פותחים חלונות לפגישות זום — הליד יוכל לבחור רק מתוך מה שתפתחו כאן. השעות בשעון ישראל.</p>

    <!-- שלב התחברות -->
    <div class="card" id="loginCard">
      <label for="pw">סיסמת ניהול</label>
      <div class="row">
        <div><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" /></div>
        <button class="btn" id="loginBtn">כניסה</button>
      </div>
      <div id="loginMsg"></div>
    </div>

    <!-- ממשק ניהול -->
    <div id="app" style="display:none;">
      <div class="card">
        <p style="font-weight:700;margin:0 0 12px;">הוספת חלון</p>
        <div class="row">
          <div>
            <label for="date">תאריך</label>
            <input id="date" type="date" />
          </div>
          <div>
            <label for="time">שעה</label>
            <input id="time" type="time" step="900" />
          </div>
          <button class="btn" id="addBtn">הוסף חלון +</button>
        </div>
      </div>

      <div class="card">
        <p style="font-weight:700;margin:0 0 4px;">חלונות פתוחים</p>
        <div id="list"></div>
      </div>

      <div class="save-bar">
        <button class="btn" id="saveBtn" style="width:100%;padding:14px;">שמירת השינויים</button>
        <div id="saveMsg"></div>
      </div>
    </div>
  </div>

  <script>
    const API = '/.netlify/functions/availability-admin';
    const HE_DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const HE_MONTHS = ['בינואר','בפברואר','במרץ','באפריל','במאי','ביוני','ביולי','באוגוסט','בספטמבר','באוקטובר','בנובמבר','בדצמבר'];
    let token = '';
    let windows = []; // [{date, time}]

    function dayLabel(date) {
      const [y, mo, d] = date.split('-').map(Number);
      const dow = new Date(Date.UTC(y, mo - 1, d, 12)).getUTCDay();
      return 'יום ' + HE_DAYS[dow] + ', ' + d + ' ' + HE_MONTHS[mo - 1];
    }
    function show(el, text, kind) { el.className = 'msg ' + kind; el.textContent = text; }
    function clear(el) { el.className = ''; el.textContent = ''; }

    async function login() {
      const pw = document.getElementById('pw').value.trim();
      const msg = document.getElementById('loginMsg');
      if (!pw) return;
      token = pw;
      clear(msg);
      try {
        const res = await fetch(API, { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) { show(msg, 'סיסמה שגויה', 'err'); token = ''; return; }
        if (res.status === 503) { show(msg, 'השרת לא מוגדר עדיין (חסרים משתני סביבה).', 'err'); token = ''; return; }
        if (!res.ok) { show(msg, 'שגיאה (' + res.status + ')', 'err'); token = ''; return; }
        const data = await res.json();
        windows = Array.isArray(data.windows) ? data.windows : [];
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        render();
      } catch (e) {
        show(msg, 'שגיאת רשת', 'err'); token = '';
      }
    }

    function addWindow() {
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      if (!date || !time) return;
      const id = date + ' ' + time;
      if (windows.some(w => w.date + ' ' + w.time === id)) return;
      windows.push({ date, time });
      windows.sort((a, b) => (a.date + ' ' + a.time).localeCompare(b.date + ' ' + b.time));
      render();
    }

    function removeWindow(date, time) {
      windows = windows.filter(w => !(w.date === date && w.time === time));
      render();
    }

    function render() {
      const list = document.getElementById('list');
      list.innerHTML = '';
      if (!windows.length) {
        list.innerHTML = '<div class="empty">אין חלונות פתוחים — היומן סגור לחלוטין.</div>';
        return;
      }
      let curDay = '';
      for (const w of windows) {
        if (w.date !== curDay) {
          curDay = w.date;
          const h = document.createElement('div');
          h.className = 'day-head';
          h.textContent = dayLabel(w.date);
          list.appendChild(h);
        }
        const row = document.createElement('div');
        row.className = 'slot';
        row.innerHTML = '<span dir="ltr">' + w.time + '</span>';
        const btn = document.createElement('button');
        btn.className = 'del';
        btn.textContent = 'הסר';
        btn.onclick = () => removeWindow(w.date, w.time);
        row.appendChild(btn);
        list.appendChild(row);
      }
    }

    async function save() {
      const msg = document.getElementById('saveMsg');
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; clear(msg);
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ windows }),
        });
        if (!res.ok) { show(msg, 'שמירה נכשלה (' + res.status + ')', 'err'); return; }
        const data = await res.json();
        windows = Array.isArray(data.windows) ? data.windows : windows;
        render();
        show(msg, 'נשמר ✓ — הלידים יראו עכשיו רק את החלונות האלה.', 'ok');
      } catch (e) {
        show(msg, 'שגיאת רשת', 'err');
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('loginBtn').onclick = login;
    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    document.getElementById('addBtn').onclick = addWindow;
    document.getElementById('saveBtn').onclick = save;
  </script>
</body>
</html>
