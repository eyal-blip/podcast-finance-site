<!DOCTYPE html>
<html>
<body>
<!-- Hidden static form definitions for Netlify Forms detection (Next.js v5 runtime migration) -->
<form name="zoom-meeting" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="zoom-meeting" />
  <input type="hidden" name="bot-field" />
  <input type="text" name="name" />
  <input type="tel" name="phone" />
  <input type="email" name="email" />
  <input type="text" name="variant" />
  <input type="text" name="savings" />
  <input type="text" name="slot" />
</form>
</body>
</html>
