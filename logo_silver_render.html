<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Heebo:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:2400px; height:800px; overflow:hidden; }

  .banner {
    width: 2400px;
    height: 800px;
    background: linear-gradient(135deg, #F7F2EA 0%, #F0EBE0 100%);
    display: flex;
    align-items: flex-start;
    padding: 130px 0 0 120px;
    direction: ltr;
    text-align: left;
  }

  .content { display: flex; flex-direction: column; gap: 0; }

  /* PRIVATE WEALTH MANAGEMENT */
  .pwm {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 10px;
    /* silver 1 — כסף עמוק, במקום הזהב הכהה */
    color: #8A96A4;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  /* Finansim */
  .finansim {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 148px;
    line-height: 1;
    color: #1A2744;
    margin-bottom: 14px;
    letter-spacing: -1px;
  }

  /* Gold/Silver line */
  .line {
    width: 960px;
    height: 1px;
    /* silver 1 */
    background: linear-gradient(to right, #8A96A4, #C0C8D0 40%, #8A96A4);
    margin-bottom: 22px;
  }

  /* פיננסים */
  .heb-main {
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 96px;
    line-height: 1;
    color: #1A2744;
    margin-bottom: 10px;
    direction: rtl;
  }

  /* ניהול הון פרטי */
  .heb-sub {
    font-family: 'Heebo', sans-serif;
    font-weight: 300;
    font-size: 44px;
    line-height: 1;
    /* silver 2 — כסף בהיר, במקום הזהב הבהיר */
    color: #A0AABB;
    letter-spacing: 2px;
    margin-bottom: 8px;
    direction: rtl;
  }

  /* שירותי פמילי אופיס */
  .heb-small {
    font-family: 'Heebo', sans-serif;
    font-weight: 300;
    font-size: 28px;
    color: #3A3028;
    opacity: 0.72;
    direction: rtl;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="content">
    <div class="pwm">PRIVATE WEALTH MANAGEMENT</div>
    <div class="finansim">Finansim</div>
    <div class="line"></div>
    <div class="heb-main">פיננסים</div>
    <div class="heb-sub">ניהול הון פרטי</div>
    <div class="heb-small">שירותי פמילי אופיס וייעוץ השקעות מתקדם</div>
  </div>
</div>
</body>
</html>
